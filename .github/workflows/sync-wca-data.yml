name: Sync WCA data

# Resynchronise une fois par jour les statistiques précalculées de l'app
# (nombre de participants par épreuve, records du monde, podiums/records
# nationaux, championnats, copie du classement séniors) depuis l'export officiel de la base WCA, qui
# n'est pas disponible en direct via l'API publique. Voir scripts/sync_wca_data.py.

"on":
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC chaque jour
  workflow_dispatch: {} # permet aussi de déclencher une synchro manuelle depuis GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sync script
        run: python3 scripts/sync_wca_data.py

      # Copie de secours du classement séniors, utilisée par l'app si wca-seniors.org ne répond pas.
      # En cas d'échec du téléchargement, on garde la copie de la veille.
      - name: Refresh senior rankings backup
        run: |
          if curl -fsSL --max-time 120 https://wca-seniors.org/data/Senior_Rankings.js -o senior_rankings.tmp \
             && grep -q '"refreshed"' senior_rankings.tmp; then
            mv senior_rankings.tmp senior_rankings.js
          else
            rm -f senior_rankings.tmp
            echo "wca-seniors.org indisponible, copie précédente conservée."
          fi

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html country_stats.json senior_rankings.js
          if git diff --cached --quiet; then
            echo "Aucun changement de données."
          else
            git commit -m "Mise à jour automatique des données WCA"
            git push
          fi
