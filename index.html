<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCA Ranking Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --surface-2: #f0f1f5;
    --border: #e3e5ec;
    --text: #14151c;
    --text-dim: #676c7c;
    --accent: #3557ea;
    --accent-2: #7c3aed;
    --accent-dim: #eaefff;
    --gold: #9a7000;
    --silver: #5b6270;
    --bronze: #8a4a1f;
    --danger: #d9534f;
    --senior: #9a6b00;
    --senior-bg: #fdf3d9;
    --world-time: #1a8f4c;
    --continental: #b35c00;
    --continental-bg-1: #ffe7c2;
    --continental-bg-2: #ffcf8f;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(20,21,28,0.04), 0 8px 24px -8px rgba(20,21,28,0.10);
    --cube-white: #f4f4f6; --cube-red: #d3273e; --cube-blue: #1857c4;
    --cube-orange: #f2760f; --cube-green: #2a9d47; --cube-yellow: #f4c300;
    --font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e13;
      --surface: #171922;
      --surface-2: #1e212c;
      --border: #2b2f3d;
      --text: #eef0f6;
      --text-dim: #9198ab;
      --accent: #6e8bff;
      --accent-2: #a685ff;
      --accent-dim: #202850;
      --gold: #f0c04a;
      --silver: #b6bdcc;
      --bronze: #e0985c;
      --danger: #ef6b67;
      --senior: #f0c04a;
      --senior-bg: #2b2408;
      --world-time: #3ddc84;
      --continental: #ffb066;
      --continental-bg-1: #3a2510;
      --continental-bg-2: #4d3010;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.55);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(720px 360px at 12% -8%, var(--accent-dim), transparent 60%),
      radial-gradient(600px 300px at 100% 0%, var(--senior-bg), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    padding: 20px 16px 90px;
  }
  .brand-stripe {
    position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 50;
    background: linear-gradient(90deg,
      var(--cube-white) 0 16.66%, var(--cube-red) 16.66% 33.33%, var(--cube-blue) 33.33% 50%,
      var(--cube-orange) 50% 66.66%, var(--cube-green) 66.66% 83.33%, var(--cube-yellow) 83.33% 100%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .hero { padding: 40px 4px 28px; }
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .hero-brand { display: flex; align-items: center; gap: 16px; }
  .lang-toggle {
    display: flex;
    gap: 3px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    box-shadow: var(--shadow);
    flex-shrink: 0;
  }
  .lang-btn {
    padding: 5px 12px;
    border-radius: 999px;
    border: none;
    box-shadow: none;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .lang-btn:hover:not(:disabled) { transform: none; filter: none; color: var(--text); }
  .lang-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }
  @media (max-width: 560px) { .hero-top { align-items: center; } }
  .brand-logo {
    height: 46px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 27px;
    letter-spacing: -0.02em;
    margin: 0 0 3px;
    background: linear-gradient(90deg, var(--text), var(--text) 60%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: var(--text-dim); font-size: 14px; margin: 0; max-width: 56ch; }
  .search-bar { display: flex; gap: 10px; }
  .search-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 6px 4px 18px;
    box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .search-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  .search-icon { color: var(--text-dim); font-size: 16px; flex-shrink: 0; }
  input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 10px 0;
    min-width: 0;
  }
  input[type="text"]::placeholder { color: var(--text-dim); font-weight: 500; opacity: 0.6; }
  button {
    padding: 0 24px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-family: var(--font-display);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent) 70%, transparent);
    transition: transform .12s, filter .12s;
  }
  button:disabled { opacity: 0.55; cursor: default; box-shadow: none; }
  button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0); }
  .hint { font-size: 12.5px; color: var(--text-dim); margin: 12px 2px 0; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin-bottom: 20px;
  }
  .error {
    background: var(--surface);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 16px 20px;
    font-size: 14px;
  }
  .profile {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface-2);
    flex-shrink: 0;
    border: 2px solid var(--border);
  }
  .profile-name { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
  .profile-meta { color: var(--text-dim); font-size: 13.5px; margin-top: 3px; }
  .profile-meta a { color: var(--accent); text-decoration: none; font-family: var(--font-mono); font-weight: 600; }
  .profile-meta a:hover { text-decoration: underline; }
  .profile-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 16px 24px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .stat { font-size: 12.5px; color: var(--text-dim); }
  .stat b { display: block; font-family: var(--font-mono); font-size: 19px; color: var(--text); font-weight: 700; }
  .stat-label-line { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 5px; }
  .travel-info-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px; height: 15px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text-dim);
    box-shadow: none;
    font-size: 10px;
    line-height: 1;
    cursor: help;
  }
  .travel-info-btn:hover { background: var(--accent-dim); color: var(--accent); transform: none; filter: none; }
  .travel-home-btn {
    padding: 3px 10px;
    font-size: 10.5px;
  }
  .travel-home-panel {
    margin-top: 14px;
    padding: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .travel-home-label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; line-height: 1.4; }
  .travel-home-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .travel-home-row input {
    flex: 1;
    min-width: 160px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: normal;
    text-transform: none;
  }
  .travel-home-status { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .section-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .section-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); flex-shrink: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  th:not(:first-child) { text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
  tbody tr { transition: background-color .1s; }
  tbody tr:hover { background: var(--surface-2); }
  tr:last-child td { border-bottom: none; }
  .event-name { font-family: var(--font-display); font-weight: 700; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .event-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }
  .rank-cell { white-space: nowrap; font-family: var(--font-mono); }
  .rank-badge {
    display: inline-block;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 12px;
  }
  .rank-badge .rank-total { font-weight: 600; opacity: 0.7; font-size: 0.88em; }
  .rank-badge.national { background: var(--accent-dim); color: var(--accent); }
  .rank-badge.continental { background: linear-gradient(135deg, var(--continental-bg-1), var(--continental-bg-2)); color: var(--continental); }
  .rank-badge.gold { background: linear-gradient(135deg,#ffe49a,#d9a520); color: #4a3300; box-shadow: 0 2px 8px -2px rgba(217,165,32,0.6); }
  .rank-badge.silver { background: linear-gradient(135deg,#eef0f5,#b7bdca); color: #262a33; box-shadow: 0 2px 8px -2px rgba(150,155,170,0.5); }
  .rank-badge.bronze { background: linear-gradient(135deg,#e8b183,#b0662f); color: #3a1f0a; box-shadow: 0 2px 8px -2px rgba(176,102,47,0.5); }
  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
  .rank-group { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .rank-group-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; color: var(--text-dim); }
  .sub-rank { color: var(--text-dim); font-size: 11px; margin-top: 3px; font-weight: 500; }
  .result-cell { color: var(--world-time); font-size: 21px; font-weight: 700; margin-bottom: 6px; font-family: var(--font-mono); letter-spacing: -0.01em; }
  .participants-cell { font-family: var(--font-mono); }
  .geo-counts { display: flex; flex-direction: column; gap: 5px; }
  .geo-count { display: flex; align-items: baseline; gap: 6px; }
  .geo-count-value { font-weight: 700; font-size: 13px; }
  .geo-count.world .geo-count-value { color: var(--text); }
  .geo-count.continental .geo-count-value { color: var(--continental); }
  .geo-count.national .geo-count-value { color: var(--accent); }
  .geo-count-label { font-size: 10.5px; color: var(--text-dim); font-weight: 600; }
  .loading { text-align: center; color: var(--text-dim); padding: 48px 0; font-size: 14px; }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    vertical-align: -4px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flag { font-size: 16px; }
  .table-wrap { overflow-x: auto; margin: 0 -6px; padding: 0 6px; }
  .footnote { font-size: 11.5px; color: var(--text-dim); margin-top: 16px; line-height: 1.55; }
  .footnote a { color: var(--accent); }
  .world-card { border-left: 4px solid var(--accent); }
  .senior-card { border-left: 4px solid var(--senior); }
  .senior-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--senior);
    margin-bottom: 2px;
  }
  .senior-badge {
    background: var(--senior-bg);
    color: var(--senior);
    border-radius: 999px;
    padding: 2px 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
  }
  .senior-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 14px; }
  .senior-cell .senior-comp { color: var(--text-dim); font-size: 11px; margin-top: 3px; font-weight: 500; }
  .senior-bracket-note { color: var(--senior); font-weight: 700; }
  .app-footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 36px; }
  @media (max-width: 560px) {
    .search-bar { flex-direction: column; }
    button { padding: 13px 20px; }
    .hero { padding: 28px 2px 20px; }
    h1 { font-size: 18px; }
    .subtitle { font-size: 12.5px; }
    .hero-brand { gap: 10px; }
    .brand-logo { height: 36px; }
    .lang-toggle { flex-shrink: 0; }
    .lang-btn { padding: 5px 9px; font-size: 11px; }
  }
  /* En dessous de cette largeur, le tableau devient une liste de fiches empilées
     (une carte par épreuve) au lieu de colonnes qui débordent horizontalement. */
  @media (max-width: 700px) {
    .card { padding: 16px; }
    .table-wrap { overflow-x: visible; margin: 0; padding: 0; }
    table, thead, tbody, tr, td { display: block; width: 100%; }
    thead { position: absolute; left: -9999px; }
    table { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    tbody tr {
      padding: 14px 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: transparent; }
    td { border-bottom: none; padding: 0; white-space: normal; }
    td.event-name {
      font-size: 15px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }
    td:not(.event-name) { padding: 8px 0 0; }
    td:not(.event-name)::before {
      content: attr(data-label);
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 5px;
    }
    .badge-row { flex-wrap: wrap; }
  }

  /* Menu de démarrage */
  .back-btn {
    display: none;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    box-shadow: none;
    padding: 0 0 14px;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .back-btn:hover:not(:disabled) { color: var(--accent); transform: none; filter: none; }
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
    margin-top: 8px;
  }
  @media (max-width: 860px) { .menu-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .menu-grid { grid-template-columns: 1fr; } }
  .menu-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    font-family: var(--font-body);
    color: var(--text);
  }
  .menu-card:hover { transform: translateY(-3px); box-shadow: 0 4px 6px rgba(20,21,28,0.06), 0 16px 32px -10px rgba(20,21,28,0.18); }
  .menu-card.ranking { border-top: 4px solid var(--senior); }
  .menu-card.custom { border-top: 4px solid var(--accent); }
  .menu-card.country { border-top: 4px solid var(--world-time); }
  .menu-card-icon { font-size: 30px; line-height: 1; height: 36px; margin-bottom: 10px; display: flex; align-items: center; }
  .menu-card-title { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .menu-card-desc { color: var(--text-dim); font-size: 13.5px; line-height: 1.5; }

  /* Recherche par nom (autocomplete) */
  .search-input-wrap { position: relative; }
  .name-suggestions {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    z-index: 20;
    max-height: 320px;
    overflow-y: auto;
  }
  .name-suggestion {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 10px 16px;
    background: none;
    border: none;
    box-shadow: none;
    border-radius: 0;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .name-suggestion:last-child { border-bottom: none; }
  .name-suggestion:hover, .name-suggestion.active { background: var(--surface-2); transform: none; filter: none; }
  .name-suggestion .sugg-id { margin-left: auto; color: var(--text-dim); font-family: var(--font-mono); font-size: 11.5px; }
  .name-suggestion .sugg-empty { color: var(--text-dim); font-weight: 400; }

  /* Vue Classements */
  .ranking-event-card { margin-bottom: 20px; }
  .ranking-event-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ranking-event-header .event-dot { width: 13px; height: 13px; }
  .ranking-event-header h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0; }
  .record-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .record-grid { grid-template-columns: 1fr; } }
  .record-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .record-box-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; color: var(--text-dim); margin-bottom: 8px; }
  .record-value { font-family: var(--font-mono); font-size: 24px; font-weight: 700; margin-bottom: 12px; }
  .record-holder { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .record-holder img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--surface); flex-shrink: 0; border: 1px solid var(--border); }
  .record-holder-name { font-weight: 700; font-size: 14px; }
  .record-holder-name a { color: var(--text); text-decoration: none; }
  .record-holder-name a:hover { color: var(--accent); }
  .record-holder-meta { font-size: 11.5px; color: var(--text-dim); }
  .record-comp { font-size: 12.5px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.5; }
  .record-comp a { color: var(--accent); text-decoration: none; }
  .record-comp a:hover { text-decoration: underline; }
  .record-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .record-link {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .record-link:hover { color: var(--accent); border-color: var(--accent); }
  .record-multi-holder { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }
  .record-multi-holder:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

// Classements séniors (40 ans et +) : la WCA ne publie aucune date de naissance publiquement,
// donc aucun classement par tranche d'âge n'existe sur worldcubeassociation.org. wca-seniors.org
// est un projet communautaire (inscription volontaire du WCA ID + date de naissance) qui republie
// un classement public par tranche d'âge cumulative (40+, 50+, 60+, 70+, 80+, 90+), recalculé
// chaque jour à partir de l'export officiel WCA. On y cherche le cubeur recherché, et on ne garde
// que la tranche la plus haute à laquelle il appartient, épreuve par épreuve.
const SENIOR_DATA_URL = 'https://wca-seniors.org/data/Senior_Rankings.js';
const SENIOR_AGE_BRACKETS = [90, 80, 70, 60, 50, 40];
let seniorIndexPromise = null;

async function loadSeniorIndex() {
  if (seniorIndexPromise) return seniorIndexPromise;
  seniorIndexPromise = (async () => {
    const res = await fetch(SENIOR_DATA_URL);
    if (!res.ok) throw new Error('wca-seniors.org indisponible');
    const text = await res.text();
    const data = JSON.parse(text.slice(text.indexOf('{')));

    // brackets[eventId][type][age] = tableau des rangs mondiaux (déjà triés), un par tranche d'âge.
    // On garde le tableau brut (pas juste l'entrée d'une personne) pour pouvoir recalculer un rang
    // national à la volée en filtrant par pays.
    const brackets = {};
    for (const event of data.events) {
      brackets[event.id] = { single: new Map(), average: new Map() };
      for (const group of event.rankings) {
        const byAge = brackets[event.id][group.type];
        if (!byAge) continue;
        byAge.set(group.age, group.ranks);
      }
    }

    const personCountry = new Map(data.persons.map(p => [p.id, p.country]));
    const personAge = new Map(data.persons.map(p => [p.id, p.age]));
    const competitions = new Map(data.competitions.map(c => [c.id, c]));
    return { refreshed: data.refreshed, brackets, personCountry, personAge, competitions };
  })();
  return seniorIndexPromise;
}

function getSeniorInfo(index, wcaId, countryIso2, eventIds, continentMap) {
  let maxAge = 0;
  const personContinent = continentMap ? continentMap.get(countryIso2) : null;
  const perEvent = {};
  for (const eid of eventIds) {
    const byType = index.brackets[eid];
    if (!byType) continue;
    const forType = {};
    for (const type of ['single', 'average']) {
      const byAge = byType[type];
      for (const age of SENIOR_AGE_BRACKETS) {
        const ranks = byAge.get(age);
        if (!ranks) continue;
        const worldEntry = ranks.find(r => r.id === wcaId);
        if (!worldEntry) continue;
        const nationalRanks = ranks.filter(r => index.personCountry.get(r.id) === countryIso2);
        const nationalRank = nationalRanks.findIndex(r => r.id === wcaId) + 1;
        let continentRank = 0, continentTotal = 0;
        if (personContinent) {
          const continentRanks = ranks.filter(r => continentMap.get(index.personCountry.get(r.id)) === personContinent);
          continentRank = continentRanks.findIndex(r => r.id === wcaId) + 1;
          continentTotal = continentRanks.length;
        }
        forType[type] = {
          rank: worldEntry.rank, worldTotal: ranks.length,
          nationalRank, nationalTotal: nationalRanks.length,
          continentRank, continentTotal,
          best: worldEntry.best, age, competition: worldEntry.competition,
        };
        break; // première (= plus haute) tranche où cette personne apparaît pour cette épreuve/type
      }
    }
    if (!forType.single && !forType.average) continue;
    perEvent[eid] = forType;
    if (forType.single) maxAge = Math.max(maxAge, forType.single.age);
    if (forType.average) maxAge = Math.max(maxAge, forType.average.age);
  }
  if (maxAge === 0) return null;
  return { maxAge, perEvent };
}

function formatSeniorCompetition(index, competitionId) {
  const comp = index.competitions.get(competitionId);
  if (!comp) return '';
  const date = new Date(comp.startDate + 'T00:00:00Z');
  const dateStr = isNaN(date) ? '' : date.toLocaleDateString(NUM_LOCALE, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  const url = `https://www.worldcubeassociation.org/competitions/${comp.webId || competitionId}`;
  return `<a href="${url}" target="_blank" rel="noopener">${comp.name}</a>${dateStr ? ' · ' + dateStr : ''}`;
}

const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};

function countryFlag(iso2) {
  if (!iso2 || iso2.length !== 2) return '';
  const codePoints = [...iso2.toUpperCase()].map(c => 127397 + c.charCodeAt(0));
  return String.fromCodePoint(...codePoints);
}

function rankBadgeClass(rank) {
  if (rank === 1) return 'gold';
  if (rank === 2) return 'silver';
  if (rank === 3) return 'bronze';
  return '';
}

function formatCentiseconds(cs) {
  const neg = cs < 0;
  cs = Math.abs(cs);
  const hours = Math.floor(cs / 360000);
  const minutes = Math.floor((cs % 360000) / 6000);
  const seconds = Math.floor((cs % 6000) / 100);
  const hundredths = cs % 100;
  let s = '';
  if (hours > 0) s += hours + ':' + String(minutes).padStart(2, '0') + ':';
  else if (minutes > 0) s += minutes + ':';
  s += (minutes > 0 || hours > 0) ? String(seconds).padStart(2, '0') : String(seconds);
  s += '.' + String(hundredths).padStart(2, '0');
  return s;
}

function parseMultiBld(value) {
  const missed = value % 100;
  let v = Math.floor(value / 100);
  const seconds = v % 100000;
  v = Math.floor(v / 100000);
  const difference = 99 - (v % 100);
  const solved = difference + missed;
  const attempted = solved + missed;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  let t = h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  return `${solved}/${attempted} ${t}`;
}

function formatResult(value, eventId) {
  if (value === undefined || value === null) return '—';
  if (value === -1) return 'DNF';
  if (value === -2) return 'DNS';
  if (value === 0) return '—';
  if (eventId === '333mbf' || eventId === '333mbo') return parseMultiBld(value);
  if (eventId === '333fm') return (value % 1 !== 0 || value > 1000) ? '' : value + ' ' + t('mouv');
  return formatCentiseconds(value);
}
function formatFMResult(value, isAverage) {
  if (value === -1) return 'DNF';
  if (value === -2) return 'DNS';
  if (!value) return '—';
  return (isAverage ? (value / 100).toFixed(2) : value) + ' ' + t('mouv');
}

const WCA_ID_RE = /^\d{4}[A-Za-z]{4}\d{2}$/;

async function fetchNameSuggestions(term) {
  const res = await fetch(`${API}/persons?q=${encodeURIComponent(term)}`);
  if (!res.ok) return [];
  const data = await res.json();
  return data.slice(0, 8).map(entry => entry.person);
}

function hideSuggestions() {
  const box = document.getElementById('nameSuggestions');
  box.style.display = 'none';
  box.innerHTML = '';
}

function renderSuggestions(list, term) {
  const box = document.getElementById('nameSuggestions');
  box.innerHTML = '';
  if (!list.length) {
    box.appendChild(el('div', 'name-suggestion', `<span class="sugg-empty">${t('suggEmpty', term)}</span>`));
  } else {
    list.forEach(person => {
      const item = el('div', 'name-suggestion',
        `${countryFlag(person.country_iso2)} ${person.name} <span class="sugg-id">${person.wca_id}</span>`);
      item.addEventListener('click', () => {
        document.getElementById('wcaIdInput').value = person.wca_id;
        hideSuggestions();
        performSearch(person.wca_id);
      });
      box.appendChild(item);
    });
  }
  box.style.display = 'block';
}

let nameSearchTimer = null;
function scheduleNameSearch(term) {
  clearTimeout(nameSearchTimer);
  nameSearchTimer = setTimeout(async () => {
    const list = await fetchNameSuggestions(term).catch(() => []);
    renderSuggestions(list, term);
  }, 300);
}

async function search() {
  hideSuggestions();
  const input = document.getElementById('wcaIdInput');
  const output = document.getElementById('output');
  const raw = input.value.trim();

  if (WCA_ID_RE.test(raw)) {
    performSearch(raw.toUpperCase());
    return;
  }

  if (!raw) {
    output.innerHTML = '';
    output.appendChild(el('div', 'error', t('errorEmptyInput')));
    return;
  }

  output.innerHTML = '';
  output.appendChild(el('div', 'loading', `<span class="spinner"></span>${t('loadingNameSearch')}`));
  const list = await fetchNameSuggestions(raw).catch(() => []);

  if (list.length === 1) {
    performSearch(list[0].wca_id);
    return;
  }
  output.innerHTML = '';
  if (!list.length) {
    output.appendChild(el('div', 'error', t('errorNoNameMatch', raw)));
    return;
  }
  output.appendChild(el('div', 'hint', t('suggestionsFound', list.length, raw)));
  renderSuggestions(list, raw);
}

let lastProfileData = null;
let travelToken = 0;

async function performSearch(wcaId) {
  const btn = document.getElementById('searchBtn');
  const output = document.getElementById('output');

  btn.disabled = true;
  output.innerHTML = '';
  output.appendChild(el('div', 'loading', `<span class="spinner"></span>${t('loadingProfile')}`));

  const seniorIndexAttempt = loadSeniorIndex().catch(() => null);
  const continentMapAttempt = loadCountryContinents().catch(() => null);
  const resultsAttempt = fetchPersonResults(wcaId);

  try {
    const personRes = await fetch(`${API}/persons/${wcaId}`);
    if (personRes.status === 404) {
      throw new Error(t('errorNoProfile', wcaId));
    }
    if (!personRes.ok) {
      throw new Error(t('errorHttp', personRes.status));
    }
    const data = await personRes.json();
    const person = data.person;
    const records = data.personal_records || {};

    const eventIds = Object.keys(records).sort((a, b) => {
      const ia = EVENT_ORDER.indexOf(a), ib = EVENT_ORDER.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });

    const seniorIndex = await seniorIndexAttempt;
    const continentMap = await continentMapAttempt;
    const seniorInfo = seniorIndex ? getSeniorInfo(seniorIndex, wcaId, person.country_iso2, eventIds, continentMap) : null;
    const personResults = await resultsAttempt;
    const recordComps = await buildRecordCompetitions(personResults, records, eventIds);

    const myTravelToken = ++travelToken;
    lastProfileData = { person, competitionCount: data.competition_count, records, eventIds, seniorIndex, seniorInfo, recordComps, travelStats: undefined, personResults };
    renderProfile(person, data.competition_count, records, eventIds, seniorIndex, seniorInfo, recordComps, undefined);

    const travelHome = loadTravelHome(wcaId);
    computeTravelStats(personResults, travelHome).catch(() => null).then((travelStats) => {
      if (myTravelToken !== travelToken) return;
      if (lastProfileData) lastProfileData.travelStats = travelStats;
      const div = document.getElementById('travelStat');
      if (div) renderTravelStat(div, travelStats);
    });
  } catch (err) {
    lastProfileData = null;
    output.innerHTML = '';
    output.appendChild(el('div', 'error', err.message || t('errorGeneric')));
  } finally {
    btn.disabled = false;
  }
}

function renderProfile(person, competitionCount, records, eventIds, seniorIndex, seniorInfo, recordComps, travelStats) {
  const output = document.getElementById('output');
  output.innerHTML = '';

  const profileCard = el('div', 'card');
  const profileRow = el('div', 'profile');
  const img = el('img', 'avatar');
  img.src = person.avatar && person.avatar.url ? person.avatar.url : '';
  img.alt = person.name;
  img.onerror = () => { img.style.display = 'none'; };
  const info = el('div');
  info.appendChild(el('div', 'profile-name', `${person.name}`));
  info.appendChild(el('div', 'profile-meta',
    `${countryFlag(person.country_iso2)} ${person.country.name} · <a href="${person.url}" target="_blank" rel="noopener">${person.wca_id}</a>`));
  profileRow.appendChild(img);
  profileRow.appendChild(info);
  profileCard.appendChild(profileRow);

  const stats = el('div', 'profile-stats');
  stats.appendChild(el('div', 'stat', `<b>${competitionCount}</b>${t('statCompetitions')}`));
  stats.appendChild(el('div', 'stat', `<b>${eventIds.length}</b>${t('statEvents')}`));
  const travelStatEl = el('div', 'stat');
  travelStatEl.id = 'travelStat';
  renderTravelStat(travelStatEl, travelStats);
  stats.appendChild(travelStatEl);
  profileCard.appendChild(stats);

  const travelPanel = el('div', 'travel-home-panel');
  travelPanel.id = 'travelHomePanel';
  travelPanel.style.display = 'none';
  travelPanel.innerHTML = `
    <label class="travel-home-label" id="travelHomeLabel"></label>
    <div class="travel-home-row">
      <input type="text" id="travelHomeInput" autocomplete="off" spellcheck="false">
      <button type="button" class="default-btn" id="travelHomeSaveBtn"></button>
      <button type="button" class="default-btn" id="travelHomeResetBtn" style="display:none"></button>
    </div>
    <div class="travel-home-status" id="travelHomeStatus"></div>
  `;
  profileCard.appendChild(travelPanel);
  output.appendChild(profileCard);
  setupTravelHomePanel(person.wca_id);

  const tableCard = el('div', 'card world-card');
  tableCard.appendChild(el('div', 'section-title', `<span class="section-dot"></span>${t('sectionRankingsTitle')}`));
  const tableWrap = el('div', 'table-wrap');
  const table = el('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th>${t('thEvent')}</th>
        <th>${t('thSingle')}</th>
        <th>${t('thAverage')}</th>
        <th>${t('thParticipants')}</th>
      </tr>
    </thead>
  `;
  const tbody = el('tbody');

  eventIds.forEach(eid => {
    const rec = records[eid];
    const tr = el('tr');

    const nameTd = el('td', 'event-name', `${eventDot(eid)}${eventName(eid)}`);
    tr.appendChild(nameTd);

    const comps = (recordComps && recordComps[eid]) || {};
    tr.appendChild(buildResultCell(rec.single, eid, false, t('labelBestTime'), comps.single));
    tr.appendChild(buildResultCell(rec.average, eid, true, t('labelAverage'), comps.average));

    tr.appendChild(buildParticipantsCell(eid, person));

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  tableWrap.appendChild(table);
  tableCard.appendChild(tableWrap);
  tableCard.appendChild(el('div', 'footnote', t('worldFootnote', EVENT_TOTALS_DATE)));
  output.appendChild(tableCard);

  if (seniorInfo) {
    output.appendChild(buildSeniorCard(person, seniorIndex, seniorInfo));
  }
}

function travelOriginShortLabel(travelStats) {
  const c = travelStats.compZero;
  return travelStats.isCustomHome ? c.name : `${c.city}, ${c.countryName || c.country_iso2}`;
}

function renderTravelStat(div, travelStats) {
  if (travelStats === undefined) {
    div.innerHTML = `<b>…</b>${t('statDistanceLoading')}`;
    div.style.display = '';
    return;
  }
  if (!travelStats) {
    div.style.display = 'none';
    return;
  }
  const km = travelStats.totalKm.toLocaleString(NUM_LOCALE);
  const c = travelStats.compZero;
  const note = travelStats.isCustomHome
    ? t('statDistanceNoteCustom', c.name, travelStats.tripCount)
    : t('statDistanceNote', c.name, c.city, `${countryFlag(c.country_iso2)} ${c.country_iso2}`, formatCompetitionDate(c));

  div.innerHTML = `
    <b>${km} km</b>
    <span class="stat-label-line">
      ${t('statDistance')} · ${t('travelOriginLabel', travelOriginShortLabel(travelStats))}
      <button type="button" id="travelInfoBtn" class="travel-info-btn">ⓘ</button>
      <button type="button" id="travelHomeBtn" class="default-btn travel-home-btn">${t('travelHomeChangeBtn')}</button>
    </span>
  `;
  div.style.display = '';

  const infoBtn = document.getElementById('travelInfoBtn');
  if (infoBtn) infoBtn.title = note;
  const homeBtn = document.getElementById('travelHomeBtn');
  if (homeBtn) {
    homeBtn.title = t('travelHomeBtnTitle');
    homeBtn.addEventListener('click', toggleTravelHomePanel);
  }
}

function toggleTravelHomePanel() {
  const panel = document.getElementById('travelHomePanel');
  if (!panel) return;
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

function setupTravelHomePanel(wcaId) {
  const panel = document.getElementById('travelHomePanel');
  if (!panel) return;
  document.getElementById('travelHomeLabel').textContent = t('travelHomeLabel');
  const input = document.getElementById('travelHomeInput');
  input.placeholder = t('travelHomePlaceholder');
  const home = loadTravelHome(wcaId);
  input.value = home ? home.label : '';
  const saveBtn = document.getElementById('travelHomeSaveBtn');
  saveBtn.textContent = t('travelHomeSaveBtn');
  const resetBtn = document.getElementById('travelHomeResetBtn');
  resetBtn.textContent = t('travelHomeResetBtn');
  resetBtn.style.display = home ? '' : 'none';
  const status = document.getElementById('travelHomeStatus');
  status.textContent = '';

  saveBtn.onclick = async () => {
    const query = input.value.trim();
    if (!query) return;
    saveBtn.disabled = true;
    status.textContent = t('travelHomeSearching');
    try {
      const geo = await geocodeCity(query);
      if (!geo) {
        status.textContent = t('travelHomeNotFound');
        saveBtn.disabled = false;
      } else {
        saveTravelHome(wcaId, { label: geo.label, lat: geo.lat, lon: geo.lon });
        performSearch(wcaId);
      }
    } catch (err) {
      status.textContent = t('travelHomeError');
      saveBtn.disabled = false;
    }
  };

  resetBtn.onclick = () => {
    saveTravelHome(wcaId, null);
    performSearch(wcaId);
  };
}

function buildSeniorCard(person, seniorIndex, seniorInfo) {

// Traite les items par lots pour ne pas envoyer des dizaines de requêtes simultanées
// à l'API WCA d'un coup (évite de se faire limiter en débit).
async function mapWithConcurrency(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

// Pour un record personnel donné (best single ou best average), retrouve la première
// compétition (la plus ancienne) où cette valeur exacte a été obtenue.
async function pickRecordCompetition(results, eid, field, value) {
  if (!value) return null;
  const candidateIds = [...new Set(
    results.filter(r => r.event_id === eid && r[field] === value).map(r => r.competition_id)
  )];
  if (!candidateIds.length) return null;
  const comps = await Promise.all(candidateIds.map(id => fetchCompetition(id)));
  let chosen = null;
  comps.forEach(c => {
    if (!c) return;
    if (!chosen || (c.start_date && (!chosen.start_date || c.start_date < chosen.start_date))) chosen = c;
  });
  return chosen;
}

async function buildRecordCompetitions(results, records, eventIds) {
  const jobs = [];
  const map = {};
  eventIds.forEach(eid => {
    map[eid] = { single: null, average: null };
    const rec = records[eid];
    if (rec.single) jobs.push({ eid, type: 'single', field: 'best', value: rec.single.best });
    if (rec.average) jobs.push({ eid, type: 'average', field: 'average', value: rec.average.best });
  });
  await mapWithConcurrency(jobs, 5, async (job) => {
    map[job.eid][job.type] = await pickRecordCompetition(results, job.eid, job.field, job.value);
  });
  return map;
}

// Distance à vol d'oiseau (km) entre deux points, formule de Haversine — utilisée
// uniquement en repli si le routage par la route (OSRM) échoue pour une paire de points.
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Distance par la route (km, itinéraire le plus rapide) entre une origine et une liste de
// points, via le service "table" d'OSRM (OpenStreetMap) : une seule requête renvoie la
// distance vers TOUS les points d'un coup. Retourne un tableau parallèle à `points`, avec
// `null` pour les points que le service n'a pas su relier par la route (ex. outre-mer).
async function fetchRoadDistancesKm(originLat, originLon, points) {
  const coords = [`${originLon},${originLat}`, ...points.map(p => `${p.lon},${p.lat}`)].join(';');
  const url = `https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=distance`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('osrm failed');
  const data = await res.json();
  if (data.code !== 'Ok' || !data.distances || !data.distances[0]) throw new Error('osrm bad response');
  return data.distances[0].slice(1).map(m => (typeof m === 'number' ? m / 1000 : null));
}

// Somme des allers-retours (km) entre une origine et une liste de compétitions, par la
// route la plus rapide (OSRM). Si OSRM ne trouve pas de route pour un point précis (îles,
// outre-mer sans liaison routière...), on retombe sur la distance à vol d'oiseau pour ce
// point seulement ; si OSRM est injoignable, on retombe sur le vol d'oiseau pour tout.
async function sumRoundTripKm(originLat, originLon, points) {
  if (!points.length) return 0;
  let roadKm;
  try {
    roadKm = await fetchRoadDistancesKm(originLat, originLon, points.map(p => ({ lat: p.latitude_degrees, lon: p.longitude_degrees })));
  } catch {
    roadKm = points.map(() => null);
  }
  let total = 0;
  points.forEach((p, i) => {
    const oneWay = roadKm[i] !== null && roadKm[i] !== undefined
      ? roadKm[i]
      : haversineKm(originLat, originLon, p.latitude_degrees, p.longitude_degrees);
    total += 2 * oneWay;
  });
  return total;
}

// Kilomètres parcourus en compétition : par défaut, la "compétition zéro" est la toute
// première compétition du cubeur (sert de point de départ / domicile supposé). Pour
// chaque compétition suivante, on cumule l'aller-retour PAR LA ROUTE (itinéraire le plus
// rapide, via OSRM) entre la compétition zéro et cette compétition. On utilise les
// coordonnées GPS exactes de chaque salle (lat/long WCA) plutôt que le nom de ville, pour
// ne jamais confondre deux villes homonymes dans des pays différents. Si un point de départ
// personnalisé (customHome, ville de résidence géocodée) est fourni, il remplace la
// compétition zéro et TOUTES les compétitions (y compris la première) comptent pour un
// aller-retour.
async function computeTravelStats(personResults, customHome) {
  const compIds = [...new Set(personResults.map(r => r.competition_id))];
  if (!compIds.length) return null;

  const comps = await mapWithConcurrency(compIds, 5, id => fetchCompetition(id));
  const valid = comps.filter(c => c && c.start_date &&
    typeof c.latitude_degrees === 'number' && typeof c.longitude_degrees === 'number');

  if (customHome) {
    if (!valid.length) return null;
    const compZero = {
      name: customHome.label, city: customHome.label, country_iso2: '',
      latitude_degrees: customHome.lat, longitude_degrees: customHome.lon,
    };
    const totalKm = await sumRoundTripKm(customHome.lat, customHome.lon, valid);
    return {
      totalKm: Math.round(totalKm), compZero, tripCount: valid.length,
      skipped: comps.length - valid.length, isCustomHome: true,
    };
  }

  if (valid.length < 2) return null;
  valid.sort((a, b) => a.start_date < b.start_date ? -1 : a.start_date > b.start_date ? 1 : 0);
  const compZero = valid[0];
  const countries = await loadCountriesList().catch(() => []);
  const countryMatch = countries.find(c => c.iso2 === compZero.country_iso2);
  compZero.countryName = countryMatch ? countryMatch.name : compZero.country_iso2;
  const rest = valid.slice(1);
  const totalKm = await sumRoundTripKm(compZero.latitude_degrees, compZero.longitude_degrees, rest);
  return {
    totalKm: Math.round(totalKm), compZero, tripCount: rest.length,
    skipped: comps.length - valid.length, isCustomHome: false,
  };
}

// Géocodage ville -> coordonnées GPS via Nominatim (OpenStreetMap), pas de clé requise.
// On ne garde que "Ville, Pays" (composants structurés de l'adresse), pas l'adresse
// complète renvoyée par Nominatim.
async function geocodeCity(query) {
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&accept-language=${currentLang}&q=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('geocode failed');
  const list = await res.json();
  if (!list.length) return null;
  const r = list[0];
  const addr = r.address || {};
  const city = addr.city || addr.town || addr.village || addr.municipality || addr.county || r.name || r.display_name.split(',')[0];
  const country = addr.country || r.display_name.split(',').pop().trim();
  return { label: `${city}, ${country}`, lat: parseFloat(r.lat), lon: parseFloat(r.lon) };
}

function getRankingEventIds() {
  return EVENT_ORDER.filter(eid => EVENT_RECORDS[eid]);

let selectedRankingEvents = null; // null tant que non initialisé ; Set ensuite

function initEventFilter() {
  const allIds = getRankingEventIds();
  if (!selectedRankingEvents) selectedRankingEvents = new Set(allIds);

  document.getElementById('eventFilterAllLabel').textContent = t('eventFilterAll');

  const list = document.getElementById('eventFilterList');
  list.innerHTML = '';
  allIds.forEach(eid => {
    const label = el('label', 'event-filter-option', `
      <input type="checkbox" data-event="${eid}" ${selectedRankingEvents.has(eid) ? 'checked' : ''}>
      ${eventDot(eid)}<span>${eventName(eid)}</span>
    `);
    label.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) selectedRankingEvents.add(eid);
      else selectedRankingEvents.delete(eid);
      syncEventFilterAllCheckbox();
      updateEventFilterButtonLabel();
      applyEventFilter();
    });
    list.appendChild(label);
  });

  syncEventFilterAllCheckbox();
  updateEventFilterButtonLabel();
}

function syncEventFilterAllCheckbox() {
  const allIds = getRankingEventIds();
  const allCb = document.getElementById('eventFilterAllCheckbox');
  const selectedCount = selectedRankingEvents.size;
  allCb.checked = selectedCount === allIds.length;
  allCb.indeterminate = selectedCount > 0 && selectedCount < allIds.length;
}

function updateEventFilterButtonLabel() {
  const allIds = getRankingEventIds();
  const btn = document.getElementById('eventFilterBtn');
  btn.textContent = selectedRankingEvents.size === allIds.length
    ? t('eventFilterAll')
    : t('eventFilterSummary', selectedRankingEvents.size);
}

function applyEventFilter() {
  document.querySelectorAll('#rankingOutput .ranking-event-card').forEach(card => {
    card.style.display = selectedRankingEvents.has(card.dataset.event) ? '' : 'none';
  });
}

document.getElementById('eventFilterAllCheckbox').addEventListener('change', (e) => {
  const allIds = getRankingEventIds();
  selectedRankingEvents = new Set(e.target.checked ? allIds : []);
  document.querySelectorAll('#eventFilterList input[type="checkbox"]').forEach(cb => {
    cb.checked = e.target.checked;
  });
  updateEventFilterButtonLabel();
  applyEventFilter();
});

document.getElementById('eventFilterBtn').addEventListener('click', () => {

});

document.addEventListener('click', (e) => {

async function buildRecordBox(eid, recordData, label, isAverage, seniorIndex) {
  const box = el('div', 'record-box');
  box.appendChild(el('div', 'record-box-label', label));

  if (!recordData) {
    box.appendChild(el('div', 'result-cell', t('recordNone')));
    return box;
  }

  const valueText = eid === '333fm' ? formatFMResult(recordData.value, isAverage) : formatResult(recordData.value, eid);
  box.appendChild(el('div', 'record-value', valueText));

  if (recordData.holders.length > 1) {
    box.appendChild(el('div', 'record-tie-note', t('recordTie', recordData.holders.length)));
  }

  const multi = recordData.holders.length > 1;
  for (const holder of recordData.holders) {
    const wrap = el('div', multi ? 'record-multi-holder' : '');
    const [person, comp] = await Promise.all([fetchPersonBasic(holder.personId), fetchCompetition(holder.competitionId)]);

    const name = person ? person.name : holder.personId;
    const profileUrl = person ? person.url : `https://www.worldcubeassociation.org/persons/${holder.personId}`;

    const holderRow = el('div', 'record-holder');
    const img = el('img');
    img.src = person && person.avatar && person.avatar.url ? person.avatar.url : '';
    img.alt = name;
    img.onerror = () => { img.style.display = 'none'; };
    holderRow.appendChild(img);

    const info = el('div');
    info.appendChild(el('div', 'record-holder-name', `<a href="${profileUrl}" target="_blank" rel="noopener">${name}</a>`));
    const age = seniorIndex ? seniorIndex.personAge.get(holder.personId) : null;
    const countryText = person ? `${countryFlag(person.country_iso2)} ${person.country.name}` : '';
    info.appendChild(el('div', 'record-holder-meta', `${countryText}${age ? ` · ${t('ageBadge', age)}` : ''}`));
    holderRow.appendChild(info);
    wrap.appendChild(holderRow);

    const compName = comp ? comp.name : holder.competitionId;
    const compUrl = comp ? comp.url : `https://www.worldcubeassociation.org/competitions/${holder.competitionId}`;
    const compDate = formatCompetitionDate(comp);
    wrap.appendChild(el('div', 'record-comp', `<a href="${compUrl}" target="_blank" rel="noopener">${compName}</a>${compDate ? ' · ' + compDate : ''}`));

    const links = el('div', 'record-links');
    links.innerHTML = `
      <a class="record-link" href="${youtubeSearchUrl(name, eventName(eid), isAverage)}" target="_blank" rel="noopener">${t('recordVideoLink')}</a>
      <a class="record-link" href="${cubeSearchUrl(name)}" target="_blank" rel="noopener">${t('recordCubeLink')}</a>
    `;
    wrap.appendChild(links);

    box.appendChild(wrap);
  }
  return box;
}

  const box = document.getElementById('countrySuggestions');
  box.style.display = 'none';
  box.innerHTML = '';
}

async function renderCountrySuggestions(term) {
  const box = document.getElementById('countrySuggestions');
  const countries = await loadCountriesList();
  const q = term.trim().toLowerCase();
  const matches = countries.filter(c => c.name.toLowerCase().includes(q)).slice(0, 8);
  box.innerHTML = '';
  if (!matches.length) {
    box.appendChild(el('div', 'name-suggestion', `<span class="sugg-empty">${t('suggEmpty', term)}</span>`));
  } else {
    matches.forEach(c => {
      const item = el('div', 'name-suggestion', `${countryFlag(c.iso2)} ${c.name}`);
      item.addEventListener('click', () => {
        document.getElementById('countryInput').value = c.name;
        hideCountrySuggestions();
        selectCountry(c.iso2, c.name);
      });
      box.appendChild(item);
    });
  }
  box.style.display = 'block';
}

let countrySearchTimer = null;
function scheduleCountrySearch(term) {
  clearTimeout(countrySearchTimer);
  countrySearchTimer = setTimeout(() => renderCountrySuggestions(term), 200);
}

let lastCountrySelection = null;

async function selectCountry(iso2, name) {
  hideCountrySuggestions();
  lastCountrySelection = { iso2, name };
  const output = document.getElementById('countryOutput');
  output.innerHTML = '';
  output.appendChild(el('div', 'loading', `<span class="spinner"></span>${t('countryLoading')}`));

  const stats = await loadCountryStats();
  if (!stats) {
    output.innerHTML = '';
    output.appendChild(el('div', 'error', t('countryError')));
    return;
  }
  lastCountrySelection = { iso2, name, entry: stats[iso2] };
  renderCountryStats(iso2, name, stats[iso2]);
}

let countryRenderToken = 0;

function renderCountryStats(iso2, name, entry) {
  const myToken = ++countryRenderToken;
  const output = document.getElementById('countryOutput');
  output.innerHTML = '';

  const isDefault = localStorage.getItem(DEFAULT_COUNTRY_KEY) === iso2;
  const header = el('div', 'country-header');
  header.appendChild(el('div', 'country-header-name', `<span class="country-header-flag">${countryFlag(iso2)}</span>${name}`));
  const defBtn = el('button', 'default-btn' + (isDefault ? ' active' : ''), isDefault ? t('isDefaultCountry') : t('setDefaultCountry'));
  defBtn.addEventListener('click', () => {
    if (localStorage.getItem(DEFAULT_COUNTRY_KEY) === iso2) localStorage.removeItem(DEFAULT_COUNTRY_KEY);
    else localStorage.setItem(DEFAULT_COUNTRY_KEY, iso2);
    renderCountryStats(iso2, name, entry);
  });
  header.appendChild(defBtn);
  output.appendChild(header);

  if (!entry) {
    output.appendChild(el('div', 'error', t('countryNoData')));
    return;
  }

  const loadingEl = el('div', 'loading', `<span class="spinner"></span>${t('countryLoading')}`);
  output.appendChild(loadingEl);

  (async () => {
    const eventIds = EVENT_ORDER.filter(eid => entry.events && entry.events[eid]);
    const [cards, statsCard] = await Promise.all([
      mapWithConcurrency(eventIds, 5, eid => buildCountryEventCard(eid, entry.events[eid], entry.podiumCompetitionId, name)),
      buildCountryStatsCard(entry),
    ]);
    if (myToken !== countryRenderToken) return; // un rendu plus récent a démarré entre-temps, on abandonne celui-ci
    loadingEl.remove();
    cards.forEach(c => output.appendChild(c));
    output.appendChild(statsCard);
    output.appendChild(el('div', 'footnote', t('countryFootnote', COUNTRY_STATS_DATE)));
  })();
}

const MEDALS = { 1: '🥇', 2: '🥈', 3: '🥉' };

async function buildCountryEventCard(eid, data, podiumCompetitionId, countryName) {
  const card = el('div', 'card ranking-event-card');
  card.appendChild(el('div', 'ranking-event-header', `${eventDot(eid)}<h3>${eventName(eid)}</h3>`));

  const podiumEntries = (data.podium || []).slice().sort((a, b) => a.rank - b.rank);
  if (podiumEntries.length) {
    const [persons, comp] = await Promise.all([
      Promise.all(podiumEntries.map(p => fetchPersonBasic(p.personId))),
      podiumCompetitionId ? fetchCompetition(podiumCompetitionId) : Promise.resolve(null),
    ]);
    const compUrl = comp ? comp.url : (podiumCompetitionId ? `https://www.worldcubeassociation.org/competitions/${podiumCompetitionId}` : '#');
    const year = comp && comp.start_date ? comp.start_date.slice(0, 4) : '';

    const champion = persons[0];
    const championName = champion ? champion.name : podiumEntries[0].personId;
    const isFemale = champion && champion.gender === 'f';

    const header = el('div', 'podium-header');
    header.appendChild(el('div', 'podium-title',
      `🏆 <a href="${compUrl}" target="_blank" rel="noopener">${t('podiumTitle', countryName, year)}</a>`));
    header.appendChild(el('div', 'podium-champion', t('podiumChampionTag', championName, countryName, year, isFemale)));
    card.appendChild(header);

    const podiumRow = el('div', 'podium-row');
    podiumEntries.forEach((p, i) => {
      const person = persons[i];
      const name = person ? person.name : p.personId;
      const url = person ? person.url : `https://www.worldcubeassociation.org/persons/${p.personId}`;
      const avatarUrl = person && person.avatar && person.avatar.url ? person.avatar.url : '';
      const valueText = eid === '333fm' ? formatFMResult(p.value, p.isAverage) : formatResult(p.value, eid);
      const valueTag = p.isAverage ? t('badgeAverageShort') : t('badgeSingleShort');
      podiumRow.appendChild(el('div', 'podium-col', `
        <div class="podium-avatar-wrap">
          <img src="${avatarUrl}" onerror="this.style.display='none'">
          <span class="medal">${MEDALS[p.rank] || '#' + p.rank}</span>
        </div>
        <span class="name"><a href="${url}" target="_blank" rel="noopener">${name}</a></span>
        <span class="value">${valueText} <span class="podium-value-tag">${valueTag}</span></span>
      `));
    });
    card.appendChild(podiumRow);
  }

  const grid = el('div', 'record-grid');
  grid.appendChild(await buildCountryRecordBox(eid, data.nrSingle, false, t('nrSingleLabel')));
  grid.appendChild(await buildCountryRecordBox(eid, data.nrAverage, true, t('nrAverageLabel')));
  card.appendChild(grid);
  return card;
}

async function buildCountryRecordBox(eid, nrData, isAverage, label) {
  const box = el('div', 'record-box');
  box.appendChild(el('div', 'record-box-label', label));

  if (!nrData) {
    box.appendChild(el('div', 'result-cell', t('noNationalRecord')));
    return box;
  }

  const valueText = eid === '333fm' ? formatFMResult(nrData.value, isAverage) : formatResult(nrData.value, eid);
  box.appendChild(el('div', 'record-value', valueText));

  const [person, comp] = await Promise.all([
    fetchPersonBasic(nrData.personId),
    nrData.competitionId ? fetchCompetition(nrData.competitionId) : Promise.resolve(null),
  ]);
  const name = person ? person.name : nrData.personId;
  const profileUrl = person ? person.url : `https://www.worldcubeassociation.org/persons/${nrData.personId}`;

  const holderRow = el('div', 'record-holder');
  const img = el('img');
  img.src = person && person.avatar && person.avatar.url ? person.avatar.url : '';
  img.alt = name;
  img.onerror = () => { img.style.display = 'none'; };
  holderRow.appendChild(img);
  const info = el('div');
  info.appendChild(el('div', 'record-holder-name', `<a href="${profileUrl}" target="_blank" rel="noopener">${name}</a>`));
  holderRow.appendChild(info);
  box.appendChild(holderRow);

  if (comp) {
    const compDate = formatCompetitionDate(comp);
    box.appendChild(el('div', 'record-comp', `<a href="${comp.url}" target="_blank" rel="noopener">${comp.name}</a>${compDate ? ' · ' + compDate : ''}`));
  }

  return box;
}

async function buildCountryStatsCard(entry) {
  const card = el('div', 'card');
  card.appendChild(el('div', 'section-title', `<span class="section-dot"></span>${t('sectionCountryStatsTitle')}`));

  const grid = el('div', 'country-stats-grid');

  const mostTitles = entry.mostTitles;
  const mostNR = entry.mostNR;
  const mostComps = entry.mostComps;
  const mostPodiums = entry.mostPodiums;
  const mostGolds = entry.mostGolds;
  const mostNCPodiums = entry.mostNCPodiums;

  const [titlesPerson, nrPerson, compsPerson, podiumsPerson, goldsPerson, ncPodiumsPerson] = await Promise.all([
    mostTitles ? fetchPersonBasic(mostTitles.personId) : null,
    mostNR ? fetchPersonBasic(mostNR.personId) : null,
    mostComps ? fetchPersonBasic(mostComps.personId) : null,
    mostPodiums ? fetchPersonBasic(mostPodiums.personId) : null,
    mostGolds ? fetchPersonBasic(mostGolds.personId) : null,
    mostNCPodiums ? fetchPersonBasic(mostNCPodiums.personId) : null,
  ]);

  grid.appendChild(await buildCountryStatBox(t('statMostTitles', mostTitles ? mostTitles.count : 0), mostTitles, titlesPerson, true));
  card.appendChild(grid);

  const compactGrid = el('div', 'country-stats-compact-grid');
  compactGrid.appendChild(buildSimpleStatBox(t('statMostNCPodiums', mostNCPodiums ? mostNCPodiums.count : 0), mostNCPodiums, ncPodiumsPerson));
  compactGrid.appendChild(buildSimpleStatBox(t('statMostPodiums', mostPodiums ? mostPodiums.count : 0), mostPodiums, podiumsPerson));
  compactGrid.appendChild(buildSimpleStatBox(t('statMostGolds', mostGolds ? mostGolds.count : 0), mostGolds, goldsPerson));
  compactGrid.appendChild(buildSimpleStatBox(t('statMostNR', mostNR ? mostNR.count : 0), mostNR, nrPerson));
  compactGrid.appendChild(buildSimpleStatBox(t('statMostComps', mostComps ? mostComps.count : 0), mostComps, compsPerson));
  card.appendChild(compactGrid);
  return card;
}

function buildSimpleStatBox(label, data, person) {
  const box = el('div', 'country-stat-card compact');
  box.appendChild(el('div', 'country-stat-label', label));
  if (!data) {
    box.appendChild(el('div', 'result-cell', t('noStatData')));
    return box;
  }
  const name = person ? person.name : data.personId;
  const url = person ? person.url : `https://www.worldcubeassociation.org/persons/${data.personId}`;
  box.appendChild(el('div', 'country-stat-value', `<a href="${url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${name}</a>`));
  return box;
}

async function buildCountryStatBox(label, data, person, withTitleList) {
  const box = el('div', 'country-stat-card');
  box.appendChild(el('div', 'country-stat-label', label));
  if (!data) {
    box.appendChild(el('div', 'result-cell', t('noStatData')));
    return box;
  }
  const name = person ? person.name : data.personId;
  const url = person ? person.url : `https://www.worldcubeassociation.org/persons/${data.personId}`;
  box.appendChild(el('div', 'country-stat-value', `<a href="${url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${name}</a>`));

  if (withTitleList && data.titles && data.titles.length) {
    const list = el('div', 'title-list');
    const comps = await Promise.all(data.titles.map(ti => fetchCompetition(ti.competitionId)));
    data.titles.forEach((ti, i) => {
      const comp = comps[i];
      const compUrl = comp ? comp.url : `https://www.worldcubeassociation.org/competitions/${ti.competitionId}`;
      const compLabel = comp ? comp.name : ti.competitionId;
      const badge = el('a', 'title-badge', `${eventName(ti.event)} · ${compLabel}`);
      badge.href = compUrl;
      badge.target = '_blank';
      badge.rel = 'noopener';
      list.appendChild(badge);
    });
    box.appendChild(list);
  }
  return box;
}

// ---------- Navigation entre vues ----------

let currentView = 'menu';

function showView(view) {
  currentView = view;
  document.getElementById('menuView').style.display = view === 'menu' ? 'grid' : 'none';
  document.getElementById('customSearchBar').style.display = view === 'custom' ? 'flex' : 'none';
  document.getElementById('customHint').style.display = view === 'custom' ? 'block' : 'none';
  document.getElementById('customView').style.display = view === 'custom' ? 'block' : 'none';
  document.getElementById('rankingView').style.display = view === 'ranking' ? 'block' : 'none';
  document.getElementById('countrySearchBar').style.display = view === 'country' ? 'flex' : 'none';
  document.getElementById('countryHint').style.display = view === 'country' ? 'block' : 'none';
  document.getElementById('countryView').style.display = view === 'country' ? 'block' : 'none';
  document.getElementById('backToMenuBtn').style.display = view === 'menu' ? 'none' : 'flex';

  const subtitle = document.getElementById('subtitleText');
  if (view === 'menu') subtitle.textContent = t('subtitleMenu');
  else if (view === 'custom') subtitle.textContent = t('subtitleCustom');
  else if (view === 'country') subtitle.textContent = t('subtitleCountry');
  else subtitle.textContent = t('subtitleRanking');

  if (view === 'ranking') loadRankingView();
  if (view === 'country') openCountryView();
}

function openCountryView() {
  const output = document.getElementById('countryOutput');
  if (lastCountrySelection) {
    renderCountryStats(lastCountrySelection.iso2, lastCountrySelection.name, lastCountrySelection.entry);
    return;
  }
  const defaultIso2 = localStorage.getItem(DEFAULT_COUNTRY_KEY);
  if (defaultIso2) {
    loadCountriesList().then(countries => {
      const c = countries.find(x => x.iso2 === defaultIso2);
      document.getElementById('countryInput').value = c ? c.name : defaultIso2;
      selectCountry(defaultIso2, c ? c.name : defaultIso2);
    });
  } else {
    output.innerHTML = '';
  }
}

// ---------- Bascule de langue ----------

function applyStaticTranslations() {
  document.documentElement.lang = currentLang;
  document.getElementById('backToMenuBtn').textContent = t('backToMenu');
  document.getElementById('menuRankingTitle').textContent = t('menuRankingTitle');
  document.getElementById('menuRankingDesc').textContent = t('menuRankingDesc');
  document.getElementById('menuCustomTitle').textContent = t('menuCustomTitle');
  document.getElementById('menuCustomDesc').textContent = t('menuCustomDesc');
  document.getElementById('menuCountryTitle').textContent = t('menuCountryTitle');
  document.getElementById('menuCountryDesc').textContent = t('menuCountryDesc');
  document.getElementById('wcaIdInput').placeholder = t('searchPlaceholder');
  document.getElementById('searchBtn').textContent = t('searchBtn');
  document.getElementById('customHint').textContent = t('customHint');
  document.getElementById('countryInput').placeholder = t('countryPlaceholder');
  document.getElementById('countryHint').textContent = t('countryHint');
  document.getElementById('appFooter').textContent = t('appFooter');
  document.getElementById('rankingPageTitle').textContent = t('menuRankingTitle');
  if (selectedRankingEvents) initEventFilter();
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });
  const subtitle = document.getElementById('subtitleText');
  if (currentView === 'menu') subtitle.textContent = t('subtitleMenu');
  else if (currentView === 'custom') subtitle.textContent = t('subtitleCustom');
  else if (currentView === 'country') subtitle.textContent = t('subtitleCountry');
  else subtitle.textContent = t('subtitleRanking');
}

function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  NUM_LOCALE = lang === 'fr' ? 'fr-FR' : 'en-US';
  localStorage.setItem('wcaAppLang', lang);
  applyStaticTranslations();

  // Re-rend le contenu déjà affiché dans la nouvelle langue.
  if (currentView === 'custom' && lastProfileData) {
    const d = lastProfileData;
    renderProfile(d.person, d.competitionCount, d.records, d.eventIds, d.seniorIndex, d.seniorInfo, d.recordComps, d.travelStats);
  }
  if (currentView === 'ranking' && rankingLoaded) {
    rankingLoaded = false;
    loadRankingView();
  }
  if (currentView === 'country' && lastCountrySelection) {
    selectCountry(lastCountrySelection.iso2, lastCountrySelection.name);
  }
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

document.querySelectorAll('.menu-card').forEach(card => {
  card.addEventListener('click', () => showView(card.dataset.target));
});
document.getElementById('backToMenuBtn').addEventListener('click', () => showView('menu'));

document.getElementById('searchBtn').addEventListener('click', search);
document.getElementById('wcaIdInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
document.getElementById('wcaIdInput').addEventListener('input', (e) => {
  const value = e.target.value.trim();
  if (WCA_ID_RE.test(value)) { hideSuggestions(); return; }
  if (value.length >= 2) scheduleNameSearch(value); else hideSuggestions();
});
document.getElementById('countryInput').addEventListener('input', (e) => {
  const value = e.target.value.trim();
  if (value.length >= 1) scheduleCountrySearch(value); else hideCountrySuggestions();
});
document.addEventListener('click', (e) => {
  const box = document.getElementById('nameSuggestions');
  const input = document.getElementById('wcaIdInput');
  if (box && !box.contains(e.target) && e.target !== input) hideSuggestions();
  const cbox = document.getElementById('countrySuggestions');
  const cinput = document.getElementById('countryInput');
  if (cbox && !cbox.contains(e.target) && e.target !== cinput) hideCountrySuggestions();
});

applyStaticTranslations();
showView('menu');
</script>
